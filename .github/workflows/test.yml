name: Test
run-name: "#${{ github.run_number }} test by ${{ github.triggering_actor }}"
on:
  pull_request:
    paths:
  workflow_dispatch:
env:
  GITHUB_PAT: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
  PYTHON_VERSION: 3.12
  TEMP_FILE: tmp/output.txt
  FILTER_FILE: tmp/filter.txt
  TMS_ADAPTER_MODE: 1
  TMS_CERT_VALIDATION: false
  TMS_OVERWRITE_EXPECTED: false
  TMS_PRIVATE_TOKEN: ${{ secrets.TESTIT_PRIVATE_TOKEN }}
  TMS_URL: ${{ secrets.TESTIT_URL }}
  TMS_IMPORT_REALTIME: false
  TMS_TRACE_HTTP: true
jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check run-e2e label or workflow_dispatch
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: ${{ matrix.project_name }} (.NET ${{ matrix.dotnet_version }})
    needs: check-label
    if: needs.check-label.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet_version: 10.0.x
            configuration_id: SPECFLOW_CONFIGURATION_ID
            package_name: SpecFlowPlugin
            project_id: SPECFLOW_PROJECT_ID
            project_name: SpecFlowTests
            filter_framework: specflow
            supports_mode0: true
          - dotnet_version: 10.0.x
            configuration_id: XUNIT_CONFIGURATION_ID
            package_name: XUnit
            project_id: XUNIT_PROJECT_ID
            project_name: XUnitTests
            filter_framework: xunit
            supports_mode0: true
    env:
      ADAPTER_PACKAGE: Tms.Adapter.${{ matrix.package_name }}/Tms.Adapter.${{ matrix.package_name }}.csproj
      TMS_CONFIGURATION_ID: ${{ secrets[matrix.configuration_id] }}
      TMS_PROJECT_ID: ${{ secrets[matrix.project_id] }}
      TMS_TEST_RUN_NAME: ${{ matrix.project_name }} TestRun
      TEST_ROOT: dotnet-examples/${{ matrix.project_name }}/${{ matrix.project_name }}
      SUBSET_IDS_FILE: api-validator-dotnet/ci/mode0/${{ matrix.project_name }}/external-ids.txt
    steps:
      - name: Checkout adapters-dotnet
        uses: actions/checkout@v5
      - name: Checkout api-validator-dotnet
        uses: actions/checkout@v5
        with:
          repository: testit-tms/api-validator-dotnet
          token: ${{ env.GITHUB_PAT }}
          ref: feat/TMS-38946   # temporary; drop after merge to main
          path: api-validator-dotnet
      - name: Checkout testit-cli
        uses: actions/checkout@v5
        with:
          repository: testit-tms/testit-cli
          token: ${{ env.GITHUB_PAT }}
          ref: fix/autotests-filter-project-scope   # temporary; drop after merge/PyPI
          path: testit-cli
      - name: Checkout dotnet-examples
        uses: actions/checkout@v5
        with:
          repository: testit-tms/dotnet-examples
          path: dotnet-examples
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet_version }}
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup environment
        run: |
          dotnet remove ${{ env.TEST_ROOT }}/${{ matrix.project_name }}.csproj package TestIT.Adapter.${{ matrix.package_name }} || true
          dotnet add ${{ env.TEST_ROOT }}/${{ matrix.project_name }}.csproj reference Tms.Adapter.Core/Tms.Adapter.Core.csproj
          dotnet add ${{ env.TEST_ROOT }}/${{ matrix.project_name }}.csproj reference ${{ env.ADAPTER_PACKAGE }}
          dotnet build --configuration Release --property WarningLevel=0 dotnet-examples/${{ matrix.project_name }}
          dotnet build --configuration Debug --property WarningLevel=0 api-validator-dotnet
          pip install ./testit-cli
      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
      - name: Test
        run: |
          export SYNC_STORAGE_VERSION=$(grep -o 'SyncStorageVersion = "[^"]*"' Tms.Adapter.Core/SyncStorage/SyncStorageRunner.cs | cut -d'"' -f2)
          
          mkdir -p .caches
          wget -O .caches/syncstorage-linux-amd64 \
          "https://github.com/testit-tms/sync-storage-public/releases/download/${SYNC_STORAGE_VERSION}/syncstorage-${SYNC_STORAGE_VERSION}-linux_amd64"
          chmod +x .caches/syncstorage-linux-amd64
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 & 
          
          sleep 1
          
          curl -v http://127.0.0.1:49152/health || true


          dotnet test --configuration Release --collect:"XPlat Code Coverage" --no-build dotnet-examples/${{ matrix.project_name }} || true

          sleep 1

          if curl -sf http://127.0.0.1:49152/health >/dev/null; then
            curl -v "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" --max-time 100 || true
          else
            echo "sync-storage already stopped; checking Work X marker in service.log"
            grep -q "Work X completed successfully" service.log || echo "WARNING: sync-storage stopped without Work X success marker"
          fi
          
          cat service.log

      - name: Validate
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test ImportRealtime=true
        run: |
          export TMS_IMPORT_REALTIME=true

          pkill -TERM -f syncstorage-linux-amd64 || true
          sleep 2
          pkill -KILL -f syncstorage-linux-amd64 || true

          test -x .caches/syncstorage-linux-amd64
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }} > service2.log 2>&1 &
          
          sleep 1
          
          curl -v http://127.0.0.1:49152/health || true


          dotnet test --configuration Release --collect:"XPlat Code Coverage" --no-build dotnet-examples/${{ matrix.project_name }} || true

          sleep 1

          if curl -sf http://127.0.0.1:49152/health >/dev/null; then
            curl -v "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" --max-time 100 || true
          else
            echo "sync-storage already stopped; checking Work X marker in service2.log"
            grep -q "Work X completed successfully" service2.log || echo "WARNING: sync-storage stopped without Work X success marker"
          fi
          
          cat service2.log || true

      - name: Validate ImportRealtime=true
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet



      - name: Create TestRun (Mode 2)
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test Adapter Mode 2
        run: |
          # Core XUnit/SpecFlow have no adapterMode=2; reuse would pollute the previous run (attachments x2).
          # Fresh testRunId + restarted sync-storage keeps Validate Again on a clean run.
          export TMS_ADAPTER_MODE=2

          pkill -TERM -f syncstorage-linux-amd64 || true
          sleep 2
          pkill -KILL -f syncstorage-linux-amd64 || true

          test -x .caches/syncstorage-linux-amd64
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }} > service-mode2.log 2>&1 &

          sleep 1
          curl -v http://127.0.0.1:49152/health || true

          dotnet test --configuration Release --collect:"XPlat Code Coverage" --no-build dotnet-examples/${{ matrix.project_name }} || true

          sleep 1
          if curl -sf http://127.0.0.1:49152/health >/dev/null; then
            curl -v "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" --max-time 100 || true
          else
            echo "sync-storage already stopped; checking Work X marker in service-mode2.log"
            grep -q "Work X completed successfully" service-mode2.log || echo "WARNING: sync-storage stopped without Work X success marker"
          fi

          cat service-mode2.log || true
          ls dotnet-examples/${{ matrix.project_name }}/${{ matrix.project_name }}/bin/Release/net8.0/ || true
          cat dotnet-examples/${{ matrix.project_name }}/${{ matrix.project_name }}/bin/Release/net8.0/build/.caches/shutdown.log || true

      - name: Validate Again
        run: |
          # Validate the Mode 2 test run created above (not an older completed run via skip).
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      # --- Mode 0: full suite, adapter filters by filled test run ---
      - name: Create filled TestRun Mode 0
        if: matrix.supports_mode0
        run: |
          pip install ./testit-cli
          mkdir -p tmp
          testit testrun create launch \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --project-id "${{ env.TMS_PROJECT_ID }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --autotest-external-ids-file "${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}" \
            --testrun-name "${{ matrix.project_name }} Mode0" \
            --output "${{ env.TEMP_FILE }}"
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test Adapter Mode 0
        if: matrix.supports_mode0
        run: |
          export TMS_ADAPTER_MODE=0

          pkill -TERM -f syncstorage-linux-amd64 || true
          sleep 2
          pkill -KILL -f syncstorage-linux-amd64 || true

          test -x .caches/syncstorage-linux-amd64
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }} > service.log 2>&1 &

          sleep 1
          curl -v http://127.0.0.1:49152/health || true

          # Full suite — adapter keeps only tests present in the filled run
          dotnet test --configuration Release --collect:"XPlat Code Coverage" --no-build dotnet-examples/${{ matrix.project_name }} || true

          sleep 1
          curl -v http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} --max-time 100 || true
          cat service.log || true

      - name: Validate Mode 0
        if: matrix.supports_mode0
        run: |
          export TMS_EXPECTED_EXTERNAL_IDS_FILE="${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}"
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      # --- autotests_filter + mode 1: framework runs only subset ---
      - name: Create filled TestRun Filter
        run: |
          pip install ./testit-cli
          mkdir -p tmp
          testit testrun create launch \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --project-id "${{ env.TMS_PROJECT_ID }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --autotest-external-ids-file "${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}" \
            --testrun-name "${{ matrix.project_name }} Filter" \
            --output "${{ env.TEMP_FILE }}"
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
          testit autotests_filter \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --testrun-id "$(<${{ env.TEMP_FILE }})" \
            --framework "${{ matrix.filter_framework }}" \
            --output "${{ env.FILTER_FILE }}"
          echo "Filter file:" && cat "${{ env.FILTER_FILE }}"

      - name: Test with autotests_filter
        run: |
          export TMS_ADAPTER_MODE=1

          pkill -TERM -f syncstorage-linux-amd64 || true
          sleep 2
          pkill -KILL -f syncstorage-linux-amd64 || true

          test -x .caches/syncstorage-linux-amd64
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }} > service.log 2>&1 &

          sleep 1
          curl -v http://127.0.0.1:49152/health || true

          FILTER="$(cat ${{ env.FILTER_FILE }})"
          dotnet test --configuration Release --collect:"XPlat Code Coverage" --no-build \
            --filter "$FILTER" \
            dotnet-examples/${{ matrix.project_name }} || true

          sleep 1
          curl -v http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} --max-time 100 || true
          cat service.log || true

      - name: Validate Filter
        run: |
          export TMS_EXPECTED_EXTERNAL_IDS_FILE="${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}"
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet
